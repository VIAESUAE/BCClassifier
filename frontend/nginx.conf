server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /health {
    proxy_pass http://api:8000/health;
  }
  location /ingest {
    proxy_pass http://api:8000/ingest;
    client_max_body_size 20m;
  }
  location /cards {
    proxy_pass http://api:8000/cards;
  }
  location /rag {
    proxy_pass http://api:8000/rag;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
